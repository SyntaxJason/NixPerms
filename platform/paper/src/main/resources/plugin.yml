name: NixPerms
version: '${project.version}'
main: de.astranox.nixperms.paper.NixPermsBukkit
api-version: '1.21'
load: STARTUP
authors: [Astranox]
description: Fast, predictable permissions for modern Minecraft networks.

commands:
  nixperms:
    description: Manage NixPerms users and groups
    permission: nixperms.admin
    usage: /nixperms <user|group|reload>
    aliases: [nixp]

permissions:
  nixperms.admin:
    description: Allows all NixPerms administration commands
    default: op
